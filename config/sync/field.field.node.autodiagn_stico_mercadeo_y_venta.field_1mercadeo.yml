label: '1. La empresa cuenta con un proceso para conocer el Tamaño del Mercado que atiende y el perfil de su cliente.'
description: "El perfil del cliente es identificar características de las personas u empresas que necesitan o desean comprar los productos o servicios y están dispuestos a pagar por ellos, pueden ser características los que compran actualmente, los que la empresa espera que compren en el futuro o que dejaron de comprar y la empresa espera que regrese.\r\nTamaño del mercado es : saber quiénes son los clientes potenciales, dónde están ubicados y cuánto gastan en promedio en satisfacer sus necesidades o deseos en el producto en cuestión o similares.\r\n"
