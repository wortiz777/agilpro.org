          content: '<p><span style="font-size:24px;"><span style="color:#696969;">El Autodiagn&oacute;stico 360&deg; de Competencias Blandas es una herramienta que, a trav&eacute;s de una serie de preguntas cerradas, entrega en forma r&aacute;pida un balance de c&oacute;mo est&aacute;n las habilidades emprendedoras de quien diligencia el instrumento. Los resultados del Autodiagn&oacute;stico permiten reflexionar sobre s&iacute; mismo, y es un valioso insumo para dise&ntilde;ar y poner en pr&aacute;cticas estrategias que permitan avanzar m&aacute;s r&aacute;pido hacia sus mentas como emprendedor.</span></span></p>'
