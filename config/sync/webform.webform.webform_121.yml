id: webform_121
title: '360° Direccionamiento'
description: null
categories: {  }
elements: |
  1_estrategia:
      '#type': textfield
      '#title': '1. Objetivos empresariales que la empresa está trabajando actualmente.'
  2_estrategia:
      '#type': textfield
      '#title': '2. Número de indicadores que mide la gestión de la empresa.'
  3_porcentaje_de_avance_del_plan:
      '#type': textfield
      '#title': '3. Porcentaje de avance del plan estratégico de la empresa.'
  4_estrategia:
      '#type': number
      '#title': '4. El Número de veces que se hace seguimiento al plan estratégico en el semestre.'
  5_estrategia:
      '#type': textfield
      '#title': '5. Adjuntar organigrama si lo tiene.'
  direccionamiento_estrategico2:
      '#type': textfield
      '#title': 'Direccionamiento Estratégico'
  a1_direccionamiento_a:
      '#type': textfield
      '#title': '1. La empresa tiene identificada, escrita y socializada su misión, visión y valores corporativos.'
  estrategia:
      '#type': textfield
      '#title': Estrategia
  a_2_direccionamiento_a:
      '#type': textfield
      '#title': '2. La empresa cuenta con un diagnóstico actualizado que sirve para determinar objetivos.'
  a_3_direccionamiento_a:
      '#type': textfield
      '#title': '3. En la empresa se analiza la competencia, el entorno y los grupos de interés para establecer estrategias empresarial.'
  a4_direccionamiento_a:
      '#type': textfield
      '#title': '4. La empresa tiene identificados los objetivos empresariales.'
  a5_direccionamiento_a:
      '#type': textfield
      '#title': '5. La estructura y organización interna de la empresa favorece la implementación de estrategias y planes de trabajo definidos.'
  a6_direccionamiento_a:
      '#type': textfield
      '#title': '6. La empresa cuenta con planes de acción en curso para lograr los objetivos empresariales establecidos.'
  a7_direccionamiento_a:
      '#type': textfield
      '#title': '7. La empresa tiene un proceso ( indicadores) para medir el cumplimiento de los objetivos empresariales.'
  a8_direccionamiento_a:
      '#type': textfield
      '#title': '8.La empresa tiene un proceso para comunicar a sus colaboradores los roles que deben desempeñar para alcanzar los objetivos empresariales.'
  a9_direccionamiento_a:
      '#type': textfield
      '#title': '9. La empresa cuenta con un sistema de información y de manejo de documentos efectivo para la toma de decisiones.'
  ab10_direccionamiento:
      '#type': textfield
      '#title': '10. En la empresa se utilizan: gráficos, histogramas y/o diagramas para medir como se hace el trabajo.'
