id: webform_127
title: '360° Financiero'
description: null
categories: {  }
elements: |
  1_financiero:
      '#type': textfield
      '#title': '1. La empresa cuenta con un proceso para organizar y mantener al día los libros contables y de seguimiento de cuentas'
  2_financiero:
      '#type': textfield
      '#title': '2. El sistema de contabilidad y costos ofrece información confiable y oportuna para la toma de decisiones.'
  33_se_cuenta_con_la_herramienta_que_indica_el_nivel_de_liquidez_apropiado_para_el_normal_funcionamiento_de_la_empresa:
      '#type': textfield
      '#title': '3.3. Se cuenta con la herramienta que indica el nivel de liquidez apropiado para el normal funcionamiento de la empresa.'
  4_financiero:
      '#type': textfield
      '#title': '4. La empresa tiene una política definida para el manejo de su cartera y la mantiene controlada.'
  5_financiero:
      '#type': textfield
      '#title': '5. Cuenta con la herramienta para identificar cómo se componen sus ingresos y analiza su comportamiento para tomar decisiones.'
  6_financiero:
      '#type': textfield
      '#title': '6. La empresa conoce el proceso para identificar su capacidad de endeudamiento.'
  7_financiero:
      '#type': textfield
      '#title': '7. Le empresa maneja el flujo de caja para cumplir oportunamente con los compromisos adquiridos.'
  8_financiero:
      '#type': textfield
      '#title': '8. Se hace análisis financiero mensualmente.'
  9_financiero:
      '#type': textfield
      '#title': '9. La empresa tiene centros de costos separados para las diferentes líneas de negocio.'
  10_financiero:
      '#type': textfield
      '#title': '10. La empresa conoce su punto de equilibrio.'
  11_financiero:
      '#type': textfield
      '#title': '11. La empresa conoce su necesidad de capital de trabajo y lo genera a través de los ingresos.'
  12_financiero:
      '#type': textfield
      '#title': '12. Conoce los productos financieros que pueden ayudar al desarrollo del negocio. (leasing, compra de cartera, sobregiros, entre otros) '
  13_financiero:
      '#type': textfield
      '#title': '13. Tiene identificado qué tipos de entidades le pueden prestar apoyo económico en el sector financiero y conoce que  requisitos  se piden.'
  14_financiero:
      '#type': textfield
      '#title': '14. Posee un buen historial crediticio y genera confianza en el mercado financiero.'
  15_financiero:
      '#type': textfield
      '#title': '15. Tiene identificada plenamente cuales son las necesidades en materia económica.'
  financiero_2:
      '#type': textfield
      '#title': FINANCIERO
  financiero2:
      '#type': textfield
      '#title': Financiero
  1_financiero2:
      '#type': textfield
      '#title': '1. Cual es el régimen de impuesto a las ventas al que pertenece.'
  2_financiero2:
      '#type': number
      '#title': '2. En este momento cual es el monto total de las deudas financieras de la empresa.'
  3_financiero2:
      '#type': number
      '#title': '3. A cuanto ascienden sus activos.'
  4_financiero2:
      '#type': number
      '#title': '4. Cual es el valor promedio de la rotación de inventarios en días.'
  5_financiero2:
      '#type': number
      '#title': '5. Cual es el monto promedio de rotación de cartera.'
  6_financiero2:
      '#type': number
      '#title': '6. Cuales el monto de su capital de trabajo.'
  7_financiero2:
      '#type': number
      '#title': '7. Cual es la utilidad promedio mensual de su negocio en el último año.'
  estados_financieros:
      '#type': textfield
      '#title': 'Estados Financieros'
  8_financiero2:
      '#type': textfield
      '#title': '8. Enviar los estados financieros que tenga'
