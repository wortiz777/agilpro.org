id: webform_125
title: '360° Técnico y Operativo'
description: null
categories: {  }
elements: |
  1_gestion:
      '#type': textfield
      '#title': '1. La empresa cuenta con infraestructura e instalaciones adecuadas para atender sus necesidades de funcionamiento, producción...'
  2_gestion:
      '#type': textfield
      '#title': '2.El proceso de elaboración del producto/servicio de la empresa cuenta con un nivel de estandarización y modularidad que facilita y agiliza su producción.'
  3_gestion:
      '#type': textfield
      '#title': '3. La empresa ha aplicado innovación a sus procesos, productos y servicios.'
  4_gestion:
      '#type': textfield
      '#title': '4. La empresa cuenta con un esquema para tomar acciones preventivas y correctivas necesarias para eliminar causas y evitar que se presenten o se vuelvan a presentar fallas en la calidad del producto o servicio.'
  5_gestion:
      '#type': textfield
      '#title': '5. La empresa tiene un sistema de calidad para revisar o evaluar entre otros , procesos, materia prima, insumos, proveedores o personal contratado, o instalaciones que le permita asegurar la calidad ofrecida al cliente.'
  6_gestion:
      '#type': textfield
      '#title': '6. La empresa cuenta con indicadores de productividad a los procesos de la organización para medirlos y aplicar mejoramiento continuo.'
  7_gestion:
      '#type': textfield
      '#title': '7.El proceso de producción / prestación del servicio de la empresa es flexible y permite cambios de acuerdo a las necesidades del cliente.'
  8_gestion:
      '#type': textfield
      '#title': '8. La empresa tiene establecida una metodología para recibir retroalimentación con el cliente para el mejoramiento del producto.'
  9_gestion:
      '#type': textfield
      '#title': '9. La empresa tiene establecida una ficha técnica o documentación descriptiva de los requisitos del producto o servicio.'
  10_gestion:
      '#type': textfield
      '#title': '10. La empresa cuenta con una estrategia para generar, capacitar y proteger el know-how propio.'
  gestion_tecnica___produccion2:
      '#type': textfield
      '#title': 'GESTIÓN TÉCNICA / PRODUCCIÓN'
  gestion_tecnica:
      '#type': textfield
      '#title': 'GESTIÓN TÉCNICA'
  1_tecnica:
      '#type': number
      '#title': '1. Numero de unidades de productos o servicios producidos en promedio por mes en el ultimo año.'
  2_porcentaje_de_la_capacidad_instalada_mensual_que_esta_utilizando_actualmente:
      '#type': textfield
      '#title': '2. Porcentaje de la capacidad instalada mensual que está utilizando actualmente.'
  3_tecnica:
      '#type': number
      '#title': '3. La Capacidad productiva estimada en unidades de producción o servicios al mes.'
  4_tecnica:
      '#type': number
      '#title': '4. Número de nuevos productos o servicios en desarrollo.'
  5_tecnica:
      '#type': number
      '#title': '5. Numero de productos o servicios con fallas presentados en promedio por mes en el ultimo año.'
