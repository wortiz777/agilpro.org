description: "6.La empresa cuenta con indicadores de productividad a los procesos de la organización para medirlos y aplicar mejoramiento continuo.\r\nLos indicadores de productividad son aquellas variables que nos ayudan a identificar algún defecto o imperfección que exista cuando elaboramos un producto u ofrecemos un servicio, y de este modo reflejan la eficiencia en el uso de los recursos generales y recursos humanos de la empresa, y pueden ser cuantitativos y cualitativos.\r\nEl mejoramiento continuo es el conjunto de todas las acciones diarias que permiten que los procesos y la empresa sean más competitivos en la satisfacción del cliente."
