name: 'Subtema Ama-gi SAS (AgilPro.org)'
type: theme
description: 'Subtema Bootstrap personalizado para AgilPro.org, migrado desde Drupal 7.'
core_version_requirement: ^10.3 || ^11
base theme: bootstrap

libraries:
  - subtema/global-styling

libraries-override:
  bootstrap/global-styling: false
  bootstrap/messages_light: false
  fontawesome/fontawesome.svg: false
  fontawesome/fontawesome.svg.shim: false

regions:
  top_header: 'Top header'
  top_header_form: 'Top header form'
  header: 'Top Bar'
  header_form: 'Header form'
  primary_menu: 'Navigation'
  secondary_menu: 'Secondary menu'
  page_top: 'Page top'
  page_bottom: 'Page bottom'
  highlighted: 'Highlighted'
  featured_top: 'Featured top'
  breadcrumb: 'Breadcrumb'
  help: 'Help'
  content: 'Content'
  sidebar_first: 'Primary'
  sidebar_second: 'Secondary'
  featured_bottom_first: 'Featured bottom first'
  featured_bottom_second: 'Featured bottom second'
  featured_bottom_third: 'Featured bottom third'
  footer_first: 'Footer'
  footer_second: 'Footer second'
  footer_third: 'Footer third'
  footer_fourth: 'Footer fourth'
  footer_fifth: 'Footer fifth'
  none: 'None'